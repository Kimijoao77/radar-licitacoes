name: Coletar licitações

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 06h17 de Brasília
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar o robô
        run: python robo/coletar.py
      - name: Salvar o resultado
        run: |
          git config user.name "radar-licitacoes"
          git config user.email "actions@users.noreply.github.com"
          git add docs/dados.json docs/dados.js
          git diff --cached --quiet || git commit -m "Atualiza licitações"
          git push
